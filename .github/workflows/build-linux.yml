name: Build Linux executable

# Builds a standalone RadioTop executable on an actual Linux runner
# (PyInstaller can't cross-compile - a Linux binary has to be built on
# Linux). Produces dist/RadioTop: a single ELF binary bundling Python, Qt,
# and all of RadioTop's own modules - no separate install step needed on
# the user's machine, just download and run (though the user's desktop
# still needs its own Qt6 multimedia backend, same as running from source
# - see README/CLAUDE.md).
#
# - Runs automatically whenever the app code, icon, or build spec change.
# - Can also be run manually from the Actions tab ("Run workflow").
# - When triggered by publishing a GitHub Release, the built binary is
#   attached to that release automatically.
#
# Either way, the result is downloadable from the workflow run's
# "Artifacts" section (Actions tab -> pick the run -> scroll to
# Artifacts), or from the Release page if it was a release build.

on:
  push:
    branches: [main]
    paths:
      - 'radiotop_gui.py'
      - 'threads.py'
      - 'stream_proxy.py'
      - 'dialogs.py'
      - 'enrichment_mixin.py'
      - 'util.py'
      - 'radiotop.spec'
      - 'assets/**'
      - '.github/workflows/build-linux.yml'
  workflow_dispatch: {}
  release:
    types: [published]

# The default GITHUB_TOKEN is read-only for Releases unless a workflow
# explicitly asks for write access here - without this, the "Attach to
# GitHub Release" step fails with "Resource not accessible by integration".
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install system dependencies
        # Present so PyInstaller's ldd-based dependency scan finds (and
        # bundles) the usual desktop-Qt runtime libs rather than skipping
        # them with "Library not found" warnings.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpulse0 libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libnss3 libopengl0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 pyinstaller

      - name: Build RadioTop
        run: pyinstaller radiotop.spec

      - name: Rename and package the binary
        # Bundles the .desktop file and icon alongside the binary so users
        # can set up a menu entry without also cloning the repo - see the
        # "Linux (prebuilt executable)" section of the README.
        run: |
          mv dist/RadioTop dist/RadioTop-linux
          chmod +x dist/RadioTop-linux
          cp assets/radiotop.desktop dist/radiotop.desktop
          cp assets/radiotop.png dist/radiotop.png
          tar -C dist -czf dist/RadioTop-linux.tar.gz RadioTop-linux radiotop.desktop radiotop.png

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: RadioTop-linux
          path: dist/RadioTop-linux.tar.gz
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: dist/RadioTop-linux.tar.gz
