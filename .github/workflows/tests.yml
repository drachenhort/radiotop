name: Tests

# Runs the pytest suite headlessly (QT_QPA_PLATFORM=offscreen, set by
# tests/conftest.py) on every push and pull request, so regressions are
# caught before merge - no display/Qt multimedia backend needed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest
