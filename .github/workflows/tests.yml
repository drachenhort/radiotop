name: Tests

# Runs the pytest suite headlessly (QT_QPA_PLATFORM=offscreen, set by
# tests/conftest.py) on every push and pull request, so regressions are
# caught before merge - no display/Qt multimedia backend needed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install system dependencies
        # PySide6 dlopens a chunk of the normal Linux desktop/media stack at
        # import time even under QT_QPA_PLATFORM=offscreen (libpulse, EGL,
        # GL, xkbcommon, ...), none of which ubuntu-latest ships by default.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpulse0 libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libnss3 libopengl0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest
